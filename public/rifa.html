<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="🎄 Carretinha de Natal — Rifa Solidária">
<meta property="og:description" content="Veja os prêmios, os avisos, as fotos e a prestação de contas da Carretinha de Natal!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Mountains+of+Christmas:wght@700&family=Playfair+Display:wght@700;800&display=swap">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<style>
:root{--verm:#b3141f;--verm2:#8f0f1a;--verm3:#d62839;--verm-claro:#fdeced;--ouro:#d4a537;--ouro2:#f2cf6b;--verde:#14532d;--verde2:#1f7a45;--creme:#fff8ef;--borda:#f0d9c9;--txt:#2a1215;--txt2:#6b4a4d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background-color:#7a0c16!important;background-repeat:no-repeat!important;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;padding-bottom:110px;
  background:radial-gradient(1000px 500px at 50% -200px,#e23744 0%,transparent 70%),linear-gradient(180deg,#8f0f1a 0,#b3141f 340px,#7a0c16 340px,#7a0c16 100%)}
.oculto{display:none!important}
.hero{position:relative;color:#fff;text-align:center;padding:26px 16px 20px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 14px,transparent 14px 28px);pointer-events:none}
.luzes{position:absolute;left:0;right:0;top:0;height:22px;display:flex;justify-content:space-around;pointer-events:none}
.luzes i{width:10px;height:14px;border-radius:50%;margin-top:8px;box-shadow:0 0 10px currentColor;animation:pisca 1.6s infinite}
.luzes i:nth-child(4n+1){color:#f2cf6b;background:#f2cf6b}.luzes i:nth-child(4n+2){color:#3ddc84;background:#3ddc84;animation-delay:.4s}.luzes i:nth-child(4n+3){color:#fff;background:#fff;animation-delay:.8s}.luzes i:nth-child(4n){color:#6cc3ff;background:#6cc3ff;animation-delay:1.2s}
@keyframes pisca{50%{opacity:.35}}
.logo{width:116px;height:116px;border-radius:50%;margin:16px auto 10px;background:#fff;display:grid;place-items:center;overflow:hidden;border:4px solid var(--ouro2);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 8px rgba(255,255,255,.12);position:relative;z-index:1}
.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-size:58px}
.hero h1{font-family:'Mountains of Christmas','Playfair Display',serif;font-size:40px;line-height:1.05;margin:4px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.25);position:relative;z-index:1}
.hero .sub{color:#ffd9dc;margin:0;position:relative;z-index:1;font-weight:500}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;text-decoration:none;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.chip.ouro{background:linear-gradient(135deg,var(--ouro2),var(--ouro));color:#3b2700;border:none}
.chip.insta{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888);border:none}
.chip svg{width:16px;height:16px}
.flocos{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flocos i{position:absolute;top:-20px;color:#fff;opacity:.5;animation:cai linear infinite;font-style:normal}
@keyframes cai{to{transform:translateY(110vh) rotate(360deg)}}
.abas{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:10px;background:rgba(122,12,22,.94);backdrop-filter:blur(8px);border-bottom:3px solid var(--ouro2)}
.abas button{border:none;background:transparent;color:#ffd9dc;font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14.5px}
.abas button.on{background:#fff;color:var(--verm)}
.abas .badge{background:var(--ouro2);color:#3b2700;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px 12px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--creme);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);position:relative}
.card h2{margin:0 0 12px;font-size:20px;color:var(--verm);font-family:'Playfair Display',serif;display:flex;align-items:center;gap:8px}
.card.faixa{border-top:6px solid var(--ouro2)}
.vazio{text-align:center;color:var(--txt2);padding:30px 16px}
.dica{color:var(--txt2);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px;color:var(--verm)}
.stats small{color:var(--txt2)}
.barra{height:12px;background:#f3dcd2;border-radius:99px;overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--verm3) 0 10px,#fff 10px 14px)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filtros button{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;font-size:13.5px}
.filtros button.on{background:var(--verm);color:#fff;border-color:var(--verm)}
.filtros input{flex:1;min-width:140px;border:1px solid var(--borda);border-radius:999px;padding:8px 14px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
.n{border-radius:12px;padding:8px 2px;text-align:center;font-weight:800;font-size:16px;border:2px solid transparent;user-select:none;font-variant-numeric:tabular-nums}
.n small{display:block;font-size:9.5px;font-weight:600;opacity:.85}
.n.d{background:#fff;color:var(--verde);border-color:#cfe6d6;cursor:pointer}
.n.d:hover{border-color:var(--verde2)}
.n.d.sel{background:var(--verde2);color:#fff;border-color:var(--ouro2);box-shadow:0 0 0 2px var(--ouro2)}
.n.v{background:var(--verm-claro);color:#b46b71;border-color:#f3c6ca;cursor:not-allowed}
.n.r{background:#fff4e5;color:#a86a12;border-color:#f6cf98;cursor:not-allowed}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--txt2);margin-top:12px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.premios{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.premio{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--borda)}
.premio .foto{height:130px;background:linear-gradient(135deg,#fde6e8,#fff4e0);display:grid;place-items:center;font-size:42px}
.premio .foto img{width:100%;height:100%;object-fit:cover}
.premio .c{padding:10px 12px}
.premio .c b{display:block}
.premio .c small{color:var(--txt2)}
.ordem{display:inline-block;background:var(--verm);color:#fff;font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:4px}
.pix{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:2px dashed var(--ouro);border-radius:14px;padding:12px}
.pix code{font-size:16px;font-weight:800;word-break:break-all;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 16px;cursor:pointer;text-decoration:none;font:inherit;font-weight:700}
.btn.verm{background:linear-gradient(135deg,var(--verm3),var(--verm2));color:#fff}
.btn.zap{background:#25d366;color:#053d1d}
.btn.claro{background:#fff;border:1px solid var(--borda);color:var(--txt)}
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:10px 12px}
.ag .dt{min-width:60px;text-align:center;background:var(--verm);color:#fff;border-radius:12px;padding:6px 4px}
.ag .dt b{display:block;font-size:17px}
.ag .dt small{color:#ffd9dc;font-size:11px}
.ag small{display:block;color:var(--txt2)}
.aviso{overflow:hidden}
.aviso img{width:100%;max-height:420px;object-fit:cover;display:block;cursor:zoom-in}
.aviso .c{padding:14px 16px}
.aviso h3{margin:0 0 4px;font-size:17px;color:var(--verm)}
.aviso .data{font-size:12.5px;color:var(--txt2)}
.aviso p{margin:8px 0 0;white-space:pre-line}
.fixo{display:inline-block;background:var(--ouro2);color:#3b2700;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:2px}
.galeria{columns:3 220px;column-gap:10px}
.galeria figure{margin:0 0 10px;break-inside:avoid;border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in}
.galeria img{width:100%;display:block}
.galeria figcaption{padding:8px 10px;font-size:13px;color:var(--txt2)}
.lightbox{position:fixed;inset:0;background:rgba(20,0,3,.92);z-index:50;display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:12px}
.lightbox p{color:#fff;text-align:center;margin:10px 0 0}
.lightbox .x{position:absolute;top:12px;right:16px;font-size:34px;color:#fff;background:none;border:none;cursor:pointer}
.lightbox .seta{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;background:rgba(255,255,255,.12);border:none;border-radius:50%;width:52px;height:52px;cursor:pointer}
.lightbox .ant{left:10px}.lightbox .prox{right:10px}
.carrinho{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--verm);box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:10}
.carrinho .info{flex:1;min-width:180px;max-width:520px}
.carrinho b{color:var(--verm)}
footer{position:relative;z-index:1;text-align:center;color:#ffd9dc;font-size:12.5px;padding:16px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--verde);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60}
.filtros.sub button{font-size:13px;padding:6px 12px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kp>div{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px}
.kp small{display:block;color:var(--txt2);font-weight:600;font-size:12px}
.kp b{display:block;font-size:21px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--verde)}
.kp span{display:block;color:var(--txt2);font-size:11.5px;margin-top:2px}
.kp .dest{background:linear-gradient(135deg,var(--verde),var(--verde2));border:none}
.kp .dest small,.kp .dest span{color:#d6f0de}.kp .dest b{color:#fff;font-size:24px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.mini>div{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:8px 10px}
.mini small{display:block;color:var(--txt2);font-size:11.5px;font-weight:600}.mini b{font-size:17px;color:var(--verde)}
.tab{overflow-x:auto;border:1px solid var(--borda);border-radius:14px;background:#fff}
.tab table{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{background:#fbefe4;color:var(--txt2);font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap}
.tab td{padding:8px 10px;border-top:1px solid #f5e6da;vertical-align:top}
.tab td small{color:var(--txt2)}
.tab tfoot td{font-weight:800;background:#fff8ef;border-top:2px solid var(--borda)}
.tab .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pos{color:var(--verde2)}.neg{color:var(--verm)!important}.pend{color:#a86a12;font-weight:700}.ok{color:var(--verde2);font-weight:700;white-space:nowrap}
.fm{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eee;color:#555}
.fm.pix{background:#e0ecff;color:#1d4ed8}.fm.dinheiro{background:#e3f4e8;color:#166534}
.ganh{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ganh>div{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ouro2);border-radius:14px;padding:10px}
.ganh .nb{min-width:58px;text-align:center;background:linear-gradient(135deg,var(--verm3),var(--verm2));color:#fff;border-radius:12px;padding:6px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.ganh small{display:block;color:var(--txt2)}
.mapa{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--borda);margin-top:10px;z-index:0}
.traj{border-left:6px solid var(--verm);background:#fff;border-radius:14px;padding:12px;margin-top:12px}
.traj ol{margin:8px 0 0;padding-left:22px;columns:2 220px}
.traj li{margin:2px 0;break-inside:avoid}
.posto{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px;margin-top:8px}
.posto .ic{font-size:24px}
.posto small{display:block;color:var(--txt2)}
.form-p{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-p label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--txt2)}
.form-p .inteiro{grid-column:1/-1}
.form-p input,.form-p select,.form-p textarea{border:1px solid var(--borda);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--txt);width:100%}
.form-p textarea{min-height:90px;resize:vertical}
.estrelas{display:flex;gap:4px}
.estrelas button{font-size:30px;background:none;border:none;cursor:pointer;color:#e2d3c4;padding:0;line-height:1}
.estrelas button.on{color:var(--ouro)}
.depo{background:#fff;border:1px solid var(--borda);border-radius:14px;overflow:hidden;break-inside:avoid;margin-bottom:10px}
.depo img{width:100%;display:block;max-height:380px;object-fit:cover;cursor:zoom-in}
.depo .c{padding:10px 12px}
.depo .st{color:var(--ouro);letter-spacing:1px}
.depo .resp{background:#e3f4e8;color:#166534;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
.depos{columns:2 280px;column-gap:10px}
.curtir{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:800;border:2px solid var(--verm);color:var(--verm);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer}
.curtir.on{background:var(--verm);color:#fff}
.hp{position:absolute;left:-5000px}
@media (max-width:560px){.form-p{grid-template-columns:1fr}}
@media (max-width:560px){.abas{flex-wrap:wrap;gap:4px}.hero h1{font-size:34px}.stats b{font-size:19px}.grid{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}.abas button{padding:8px 11px;font-size:13.5px}}
.leaflet-container{z-index:0;isolation:isolate;font:inherit}
.capa{padding:0;overflow:hidden}.capa img{width:100%;display:block;max-height:460px;object-fit:cover}
.lista-premios{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lista-premios>div{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px}
.lista-premios .ordem{margin:0;min-width:40px;text-align:center}
.lista-premios small{display:block;color:var(--txt2)}
.noel{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}
.noel svg{width:100%;max-width:260px;display:block;margin:0 auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.noel .fala{background:#fff;border:3px solid var(--ouro2);border-radius:20px;padding:16px 18px;font-size:18px;line-height:1.55;min-height:120px;position:relative}
.noel .fala::before{content:"";position:absolute;left:-14px;top:40px;border:12px solid transparent;border-right-color:var(--ouro2)}
.noel .fala b{color:var(--verm)}
#boca{transform-origin:130px 182px;transition:transform .08s}
.falando #boca{animation:fala .22s infinite alternate}
@keyframes fala{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
.falando #olhos{animation:pisca2 3s infinite}
@keyframes pisca2{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#olhos{transform-origin:130px 128px}
.ano{display:grid;grid-template-columns:86px 1fr;gap:14px;position:relative}
.ano .bola{background:linear-gradient(135deg,var(--verm3),var(--verm2));color:#fff;font-weight:800;font-size:22px;border-radius:16px;text-align:center;padding:12px 4px;height:fit-content;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.ano .bola small{display:block;font-size:11px;font-weight:600;color:#ffd9dc}
.mini-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px}
.mini-gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block}
.equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.equipe>div{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px}
.equipe img{width:56px;height:56px;border-radius:50%;object-fit:cover;float:left;margin:0 10px 4px 0;border:2px solid var(--ouro2)}
.noite{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:10px 12px;margin-top:8px}
.noite .n{min-width:52px;text-align:center;background:var(--verde);color:#fff;border-radius:12px;padding:6px 4px;font-weight:800}
.noite .n small{display:block;font-size:10.5px;font-weight:600;color:#d6f0de}
@media (max-width:640px){.noel{grid-template-columns:1fr}.noel .fala::before{display:none}.ano{grid-template-columns:64px 1fr}}
</style>
</head>
<body>
<div class="flocos" id="flocos"></div>
<header class="hero">
  <div class="luzes" id="luzes"></div>
  <div class="logo" id="logo"><span>🎄</span></div>
  <h1 id="titulo">Carretinha de Natal</h1>
  <p class="sub" id="subtitulo">Rifa Solidária</p>
  <div class="chips" id="chips"></div>
</header>

<nav class="abas" id="abas">
  <button data-aba="rifa" class="on">🎄 Início</button>
  <button data-aba="avisos">📢 Avisos<span class="badge oculto" id="n-avisos"></span></button>
  <button data-aba="fotos">📸 Fotos<span class="badge oculto" id="n-fotos"></span></button>
  <button data-aba="papainoel" id="aba-noel" class="oculto">🎅 Papai Noel</button>
  <button data-aba="dezanos" id="aba-10" class="oculto">🎞️ 10 anos</button>
  <button data-aba="bastidores" id="aba-bast" class="oculto">🎬 Bastidores</button>
  <button data-aba="novena" id="aba-novena" class="oculto">🙏 Novena</button>
  <button data-aba="onde" id="aba-onde" class="oculto">📍 Onde encontrar</button>
  <button data-aba="participe" id="aba-part" class="oculto">💬 Participe</button>
  <button data-aba="contas" id="aba-contas" class="oculto">💰 Contas</button>
</nav>

<main id="conteudo"><div class="card vazio">Carregando…</div></main>

<div class="carrinho oculto" id="carrinho"></div>

<footer>Feito com ❤️ pela equipe da Carretinha de Natal</footer>

function lightbox(lista, i) {
  const box = document.createElement('div'); box.className = 'lightbox';
  const passo = (d) => { i = (i + d + lista.length) % lista.length; mostra(); };
  const mostra = () => {
    const f = lista[i];
    box.innerHTML = `<button class="x" aria-label="Fechar">×</button>${lista.length > 1 ? '<button class="seta ant" aria-label="Anterior">‹</button><button class="seta prox" aria-label="Próxima">›</button>' : ''}<div><img src="${esc(f.src)}" alt=""><p>${esc(f.legenda || '')}</p></div>`;
    box.querySelector('.x').onclick = fechar;
    const a = box.querySelector('.ant'), p = box.querySelector('.prox');
    if (a) a.onclick = (e) => { e.stopPropagation(); passo(-1); };
    if (p) p.onclick = (e) => { e.stopPropagation(); passo(1); };
  };
  const tecla = (e) => { if (e.key === 'Escape') fechar(); if (lista.length > 1 && e.key === 'ArrowRight') passo(1); if (lista.length > 1 && e.key === 'ArrowLeft') passo(-1); };
  const fechar = () => { box.remove(); document.removeEventListener('keydown', tecla); };
  box.onclick = (e) => { if (e.target === box) fechar(); };
  document.addEventListener('keydown', tecla);
  mostra(); document.body.appendChild(box);
}

// Reduz a foto no próprio celular (máx. 1600 px) para enviar rápido e ocupar menos espaço
function reduzirImagem(file) {
  return new Promise((ok) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob((b) => ok(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); ok(file); };
    img.src = u;
  });
}

      <div class="inteiro"><button class="btn verm" style="width:100%">Enviar para o Papai Noel 🎅</button></div></form></div>` : ''}
    ${recados.length ? `<div class="card"><h2>📬 Recados que o Papai Noel recebeu</h2><div class="depos">${recados.map((x) => `<div class="depo"><div class="c"><b>${esc(x.nome)}</b>${x.bairro ? ` <small class="dica">· ${esc(x.bairro)}</small>` : ''}${x.texto ? `<p style="margin:6px 0 0;white-space:pre-line">${esc(x.texto)}</p>` : ''}${x.resposta ? `<div class="resp">🎅 <b>Papai Noel:</b> ${esc(x.resposta)}</div>` : ''}</div></div>`).join('')}</div></div>` : ''}`;
  const falar = () => {
    const nome = $('#noel-nome').value; const txt = textoNoel(nome, fraseIdx);
    $('#fala').innerHTML = esc(txt).replace(esc(nomeLimpo(nome) || 'meu amigo'), `<b>${esc(nomeLimpo(nome) || 'meu amigo')}</b>`);
    if (!('speechSynthesis' in window)) { toast('Seu aparelho não tem voz disponível; leia a mensagem 😊'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt.replace(/Ho ho ho!/g, 'Rô, rô, rô!'));
    u.lang = 'pt-BR'; u.pitch = 0.55; u.rate = 0.88;
    const v = vozes.find((x) => /male|masc|daniel|ricardo|antonio|felipe/i.test(x.name)) || vozes.find((x) => /pt-BR/i.test(x.lang)) || vozes[0];
    if (v) u.voice = v;
    const box = $('#santa');
    u.onstart = () => box.classList.add('falando');
    u.onend = u.onerror = () => box.classList.remove('falando');
    speechSynthesis.speak(u);
  };
  $('#noel-ouvir').onclick = falar;
  $('#noel-outra').onclick = () => { fraseIdx++; falar(); };
  $('#noel-zap').onclick = () => {
    const n = nomeLimpo($('#noel-nome').value); if (!n) return toast('Escreva o nome primeiro');
    const link = `${location.origin}${location.pathname}?c=${encodeURIComponent(slug)}&noel=${encodeURIComponent(n)}#papainoel`;
    window.open(`https://wa.me/?text=${encodeURIComponent(`🎅 Ho ho ho! O Papai Noel gravou um recado para ${n}! Abra e toque em Ouvir: ${link}`)}`, '_blank', 'noopener');
  };
  $('#noel-cartao').onclick = () => baixarCartao(nomeLimpo($('#noel-nome').value), textoNoel($('#noel-nome').value, fraseIdx));
  const fc = $('#form-carta');
  if (fc) fc.onsubmit = async (e) => {
    e.preventDefault(); if (fc.site.value) return;
    const bt = fc.querySelector('button'); bt.disabled = true;
    const { error } = await sb.rpc('natal_interagir', { p_slug: slug, p_tipo: 'recado', p_nome: fc.nome.value, p_bairro: fc.bairro.value, p_texto: fc.texto.value, p_nota: null, p_foto_path: null, p_autoriza: fc.autoriza.checked });
    bt.disabled = false;
    if (error) return toast(error.message || 'Não foi possível enviar agora');
    fc.reset(); toast('🎅 Recado enviado! O Papai Noel vai ler com carinho.');
  };
}
function baixarCartao(nome, texto) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 1350); gr.addColorStop(0, '#b3141f'); gr.addColorStop(1, '#6d0912'); g.fillStyle = gr; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = 'rgba(255,255,255,.08)'; for (let i = 0; i < 60; i++) { g.beginPath(); g.arc(Math.random() * 1080, Math.random() * 1350, 2 + Math.random() * 6, 0, 7); g.fill(); }
  const img = new Image();
  img.onload = () => {
    g.drawImage(img, 390, 90, 300, 346);
    g.fillStyle = '#fff8ef'; g.beginPath(); g.roundRect ? g.roundRect(90, 480, 900, 700, 40) : g.rect(90, 480, 900, 700); g.fill();
    g.fillStyle = '#b3141f'; g.font = 'bold 54px Georgia, serif'; g.textAlign = 'center'; g.fillText(`Para ${nome || 'você'}`, 540, 570);
    g.fillStyle = '#2a1215'; g.font = '36px Inter, Arial, sans-serif';
    const palavras = texto.split(' '); let linha = '', y = 650;
    for (const p of palavras) { const t = linha ? linha + ' ' + p : p; if (g.measureText(t).width > 800) { g.fillText(linha, 540, y); linha = p; y += 50; } else linha = t; }
    g.fillText(linha, 540, y);
    g.fillStyle = '#f2cf6b'; g.font = 'bold 40px Georgia, serif'; g.fillText(`🎄 ${D?.nome || 'Carretinha de Natal'} ${D?.ano || ''}`, 540, 1270);
    const a = document.createElement('a'); a.download = `recado-papai-noel-${(nome || 'natal').toLowerCase().replace(/\s+/g, '-')}.png`; a.href = c.toDataURL('image/png'); a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SANTA.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
}

  $('#conteudo').innerHTML = `

    ${M.novena.length ? `<div class="card"><h2>🗓️ As noites</h2>${M.novena.map((n) => `<div class="noite"><div class="n">${n.noite ? n.noite + 'ª' : '★'}<small>${n.data ? dataBR(n.data).slice(0, 5) : 'a definir'}</small></div><div><b>${esc(n.familia || 'Família a definir')}</b>${n.tema ? ` <small class="dica">· ${esc(n.tema)}</small>` : ''}<small class="dica" style="display:block">${[n.data && SEM[new Date(n.data + 'T12:00').getDay()], n.hora && '⏰ ' + n.hora, n.bairro && '📍 ' + n.bairro, n.endereco].filter(Boolean).map(esc).join(' · ')}</small></div></div>`).join('')}</div>` : ''}
    ${M.novena_ativa ? `<div class="card"><h2>✍️ Inscreva sua família</h2><form class="form-p" id="form-nov">
      <label>Nome da família *<input name="familia" maxlength="120" required placeholder="Ex.: Família Souza"></label>

      <label>WhatsApp *<input name="tel" type="tel" maxlength="20" required placeholder="(44) 99999-9999"></label>
      <label>Quantas pessoas?<input name="pessoas" type="number" min="1" max="200"></label>
      <label class="inteiro">Vocês querem<select name="receber"><option value="true">🏠 Receber uma noite da novena em casa</option><option value="false">🙏 Só participar das noites</option></select></label>
      <label>Endereço<input name="end" maxlength="160" placeholder="Rua e número"></label><label>Bairro<input name="bairro" maxlength="80"></label>
      <label class="inteiro">Datas de preferência<input name="datas" maxlength="300" placeholder="Ex.: 18 ou 20 de dezembro"></label>
      <label class="inteiro">Observações<textarea name="obs" maxlength="800"></textarea></label>
      <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="inteiro" style="flex-direction:row;align-items:flex-start;gap:8px;font-weight:500"><input type="checkbox" name="autoriza" style="width:auto;margin-top:3px"> <span>Autorizo divulgar o nome da família e o endereço na programação da novena, caso nossa casa receba uma noite.</span></label>
      <p class="dica inteiro" style="margin:0">Seus dados ficam só com a equipe da Carretinha, para organizar a novena.</p>
      <div class="inteiro"><button class="btn verm" style="width:100%;font-size:16px">Inscrever minha família 🙏</button></div></form></div>` : ''}`;
  const f = $('#form-nov'); if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault(); if (f.site.value) return;
    const bt = f.querySelector('button'); bt.disabled = true; bt.textContent = 'Enviando…';
    const { error } = await sb.rpc('natal_inscrever_novena', { p_slug: slug, p_familia: f.familia.value, p_responsavel: f.resp.value, p_telefone: f.tel.value, p_endereco: f.end.value, p_bairro: f.bairro.value,
      p_pessoas: f.pessoas.value ? +f.pessoas.value : null, p_quer_receber: f.receber.value === 'true', p_datas: f.datas.value, p_autoriza: f.autoriza.checked, p_obs: f.obs.value });
    bt.disabled = false; bt.textContent = 'Inscrever minha família 🙏';
    if (error) return toast(error.message || 'Não foi possível enviar agora');
    f.reset(); $('#conteudo').insertAdjacentHTML('afterbegin', '<div class="card faixa" style="text-align:center"><b style="color:var(--verde);font-size:17px">🙏 Inscrição recebida! A equipe vai entrar em contato pelo WhatsApp.</b></div>');
    window.scrollTo({ top: $('#abas').offsetTop, behavior: 'smooth' });
  };
}
